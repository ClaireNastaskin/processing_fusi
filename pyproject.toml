[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anise"
version = "0.1.0"
authors = [{ name = "Tyson Aflalo", email = "tyson@forestneurotech.org" }]
description = "functional neuroimaging analysis of fUSI data."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "matplotlib",
    "nilearn",
    "antspyx",
    "dipy",
    "SimpleITK",
    "imageio", 
    "imageio-ffmpeg"
]
requires-python = ">=3.9"